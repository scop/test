on:
  push:
    tags:
      - v*

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/attest@v4
        with:
          subject-path: README.md
