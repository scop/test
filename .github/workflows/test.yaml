on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: scop/common/force-color@feat/force-color-pre-commit
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v3
      - run: "mise exec -- prek run --all-files || :"
      - run: "mise exec -- pre-commit run --all-files || :"
